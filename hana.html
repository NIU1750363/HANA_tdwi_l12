<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HANA</title>
    <link rel="stylesheet" type="text/css" href="hana.css">
    <script src="hana.js"></script>
</head>
<body>
    <div id="container">
        <header id="header">
            <img src="HANA.png" id="logo-img">
            <div id="header-textos">
                <h1>Welcome to HANA</h1>
            </div>
            <img src="usuari.png" id ="inici-sessio">
        </header>   
        <div id="slogan">
            <p>HANA: Bringing Nature to Your Home</p>
        </div>
        <div id="menu">
           <section id="plantes-interior">
                <!-- Afegim id="titol-interior" per poder clicar-hi -->
                <h1 id="titol-interior" onclick="toggleSelectInterior()">Plantes d'interior</h1> <!--la unica seccio que te un menu desplegable (de moment)*-->
            </section>
            <section id="plantes-exterior">
                <h1>Plantes d'exterior</h1>
            </section>
            <section id="boquets">
                <h1>boquets</h1>
            </section>
            <section id="Productes-i-eines">
                <h1>Productes i eines</h1>
            </section>
        </div>

    </div>

    <!--select amagat de moment amb style="display:none;" -->
    <select id="plantes-interior-select" onchange="showPlantesInterior()" style="display: none;">
        <option value="">Select a plant</option>
        <option value="planta1">Orquidea</option>
        <option value="planta2">Cactus</option>
        <option value="planta3">Bonsai</option>
    </select>

    <div id="resultat-planta"></div>

    <section id="registre">
        <header>
            <h2> Inici Sessió </h2>
        </header>
        <form method="post" action="" >
            Username: <input type="text" name="username" required><br>
            Password: <input type="password" name="password" required><br>  
        </from>
    </section>

   
    
</body>
</html>
